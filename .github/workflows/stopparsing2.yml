name: stopparsing2
on:
  workflow_dispatch:
  push:
    paths: ['harness/stopparsing2.ps1', '.github/workflows/stopparsing2.yml']
jobs:
  winps51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: .\harness\stopparsing2.ps1
  pwsh7:
    name: PowerShell 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: .\harness\stopparsing2.ps1
